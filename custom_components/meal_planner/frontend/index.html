<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Meal Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Crop dialog for dish photos. If it fails to load, the upload still works,
       it just skips the cropping step. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.3/cropper.min.css" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.3/cropper.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }

    /* ── HA Theme CSS variables (defaults = dark; overridden by applyHATheme()) ── */
    :root {
      --mp-bg:         #111827;
      --mp-surface:    #1f2937;
      --mp-text:       #f9fafb;
      --mp-text-muted: #6b7280;
      --mp-border:     #374151;
      --mp-primary:    #2563eb;

      /* Theme-adaptive surfaces & accents (dark defaults) */
      --mp-surface-2:  color-mix(in srgb, var(--mp-bg) 50%, var(--mp-surface));
      --mp-surface-3:  var(--mp-bg);
      --mp-input-bg:   color-mix(in srgb, var(--mp-bg) 40%, var(--mp-surface));

      --mp-accent-green: #4ade80;
      --mp-accent-amber: #fbbf24;
      --mp-accent-blue:  #60a5fa;
      --mp-accent-red:   #f87171;
      --mp-accent-violet:#a78bfa;

      /* Tag bubbles — dark mode: saturated dark bg with light text */
      --mp-tag-dish-bg:  rgba(22,163,74,0.22);
      --mp-tag-dish-fg:  #86efac;
      --mp-tag-out-bg:   rgba(217,119,6,0.22);
      --mp-tag-out-fg:   #fcd34d;
      --mp-tag-order-bg: rgba(37,99,235,0.22);
      --mp-tag-order-fg: #93c5fd;
      --mp-tag-none-bg:  color-mix(in srgb, var(--mp-text-muted) 25%, transparent);
      --mp-tag-none-fg:  var(--mp-text-muted);

      /* Surprise result box */
      --mp-violet-bg:     rgba(124,58,237,0.14);
      --mp-violet-border: rgba(124,58,237,0.45);
    }

    /* Light mode overrides (set by JS when luminance of --mp-bg is high) */
    :root[data-theme="light"] {
      --mp-surface-2:  color-mix(in srgb, var(--mp-bg) 55%, var(--mp-surface));
      --mp-surface-3:  color-mix(in srgb, var(--mp-bg) 75%, var(--mp-surface));
      --mp-input-bg:   color-mix(in srgb, var(--mp-bg) 70%, var(--mp-surface));

      --mp-accent-green: #15803d;
      --mp-accent-amber: #b45309;
      --mp-accent-blue:  #1d4ed8;
      --mp-accent-red:   #b91c1c;
      --mp-accent-violet:#6d28d9;

      --mp-tag-dish-bg:  #dcfce7;
      --mp-tag-dish-fg:  #166534;
      --mp-tag-out-bg:   #fef3c7;
      --mp-tag-out-fg:   #92400e;
      --mp-tag-order-bg: #dbeafe;
      --mp-tag-order-fg: #1e40af;
      --mp-tag-none-bg:  #e5e7eb;
      --mp-tag-none-fg:  #4b5563;

      --mp-violet-bg:     #f5f3ff;
      --mp-violet-border: #c4b5fd;
    }

    body {
      background: var(--mp-bg);
      color: var(--mp-text);
      font-family: ui-sans-serif, system-ui, sans-serif;
      min-height: 100vh;
    }

    /* Map Tailwind's static color classes to theme variables */
    body .text-white                    { color: var(--mp-text)       !important; }
    body .text-gray-400,
    body .text-gray-500                 { color: var(--mp-text-muted) !important; }
    body .text-gray-600,
    body .text-gray-700                 { color: color-mix(in srgb, var(--mp-text-muted) 55%, transparent) !important; }

    /* Theme-adaptive surfaces (Tailwind utility overrides) */
    body .bg-gray-700                   { background-color: var(--mp-surface)   !important; }
    body .bg-gray-800                   { background-color: var(--mp-surface-2) !important; }
    body .bg-gray-900                   { background-color: var(--mp-surface-3) !important; }
    body .border-gray-600,
    body .border-gray-700               { border-color: var(--mp-border) !important; }

    /* Accent text colors adapt to theme (readable on both light & dark bg) */
    body .text-green-400                { color: var(--mp-accent-green)  !important; }
    body .text-amber-400                { color: var(--mp-accent-amber)  !important; }
    body .text-blue-400                 { color: var(--mp-accent-blue)   !important; }
    body .text-red-400                  { color: var(--mp-accent-red)    !important; }
    body .text-violet-400               { color: var(--mp-accent-violet) !important; }

    /* Form inputs: adapt bg when dark-gray is used as input bg */
    body input.bg-gray-800,
    body select.bg-gray-800,
    body textarea.bg-gray-800           { background-color: var(--mp-input-bg) !important; color: var(--mp-text) !important; }
    body input::placeholder,
    body select::placeholder,
    body textarea::placeholder          { color: var(--mp-text-muted) !important; opacity: 0.7; }

    /* Surprise result box */
    body .bg-violet-950                 { background-color: var(--mp-violet-bg)     !important; }
    body .border-violet-700             { border-color:      var(--mp-violet-border) !important; }

    /* Stats bar: text inside the colored gradient stays white in both modes */
    .bar-fill .text-white               { color: #fff !important; }

    /* Hover-state color overrides (Tailwind generates .hover\:text-*) */
    body .hover\:text-white:hover,
    body .hover\:text-gray-300:hover,
    body .hover\:text-gray-400:hover    { color: var(--mp-text) !important; }
    body .hover\:text-red-400:hover     { color: var(--mp-accent-red) !important; }

    .day-card {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      transition: transform 0.1s, box-shadow 0.1s;
      cursor: pointer;
      /* Weekend/holiday ring, today's glow and the hover lift each set their
         own variable, so none of them wipes out another */
      box-shadow: var(--mp-ring, 0 0 #0000), var(--mp-glow, 0 0 #0000), var(--mp-lift, 0 0 #0000);
    }
    /* Square cards, three rows, no scrollbar: the grid is only as wide as
       three rows of squares can be tall. The 190px cover padding, header
       and footer; 72px are the six column gaps. */
    @media (min-width: 1024px) {
      .week-grid {
        max-width: max(36rem, calc((100vh - 190px) / 3 * 7 + 72px));
        margin-inline: auto;
      }
    }
    .day-card:hover  { transform: translateY(-2px); --mp-lift: 0 6px 20px rgba(0,0,0,0.4); }
    .day-card:active { transform: scale(0.97); }

    /* ── Optional photo as card background ──
       Past days stay dimmed, upcoming days are brighter, today is undimmed. */
    .day-photo {
      position: absolute; inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.55;
      pointer-events: none;
    }
    .day-card.is-future .day-photo { opacity: 0.8; }
    .day-card.is-today  .day-photo { opacity: 1; }
    /* Scrim keeps the lower text readable on bright photos */
    .day-card.has-photo::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.60), rgba(0,0,0,0.05) 65%);
      pointer-events: none;
    }
    .day-content { position: relative; z-index: 1; }

    /* Translucent bubbles behind text — only drawn when a photo sits behind it */
    .day-card.has-photo .bubble {
      background: rgba(0,0,0,0.42);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border-radius: 0.65rem;
      padding: 0.15rem 0.5rem;
    }
    /* On a photo even today's number turns white — the badge carries the accent */
    .day-card.has-photo .wd,
    .day-card.has-photo .meal,
    .day-card.has-photo .daynum {
      color: #fff !important;
      text-shadow: 0 1px 3px rgba(0,0,0,0.75);
    }
    .day-card.has-photo .mp-day-holiday-label { text-shadow: 0 1px 3px rgba(0,0,0,0.75); }
    /* Eating-out / order tags sit on the photo too */
    .day-card.has-photo .tag {
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    /* "Today" pill next to the weekday */
    .today-badge {
      display: inline-block;
      background: var(--mp-primary);
      color: #fff;
      border-radius: 9999px;
      padding: 0.15rem 0.55rem;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      line-height: 1.3;
      vertical-align: 0.1em;
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
    }

    /* Dish photo thumbnail in the dish manager */
    .dish-thumb {
      width: 52px; height: 52px;
      flex-shrink: 0;
      border-radius: 0.7rem;
      border: 1px solid var(--mp-border);
      background-color: var(--mp-surface-2);
      background-size: cover;
      background-position: center;
      display: flex; align-items: center; justify-content: center;
      color: var(--mp-text-muted);
      font-size: 1.25rem;
      cursor: pointer;
      transition: border-color 0.12s;
    }
    .dish-thumb:hover { border-color: var(--mp-text-muted); }

    /* Crop dialog stage */
    .crop-stage {
      width: 100%;
      height: 46vh;
      min-height: 220px;
      background: var(--mp-surface-3);
      border: 1px solid var(--mp-border);
      border-radius: 0.75rem;
      overflow: hidden;
    }
    .crop-stage img { display: block; max-width: 100%; }
    /* Cropper's own chrome, nudged towards the HA theme */
    .cropper-view-box, .cropper-face { border-radius: 0.25rem; }
    .cropper-line, .cropper-point { background-color: var(--mp-primary); }
    .cropper-view-box { outline-color: var(--mp-primary); }

    /* Day card theme variants */
    .mp-day-default { background: var(--mp-surface); border: 1px solid var(--mp-border); }
    .mp-day-nothing { background: var(--mp-bg); border: 1px solid var(--mp-border); opacity: 0.6; }
    .mp-day-dish    { background: var(--mp-surface); border: 1px solid rgba(34,197,94,0.4); }
    /* Today: accent border, halo and a slight lift, so it stands out at a glance.
       `scale` is separate from `transform`, so hover and press still work. */
    .mp-day-today   {
      background: color-mix(in srgb, var(--mp-primary) 25%, var(--mp-surface));
      border: 2px solid var(--mp-primary);
      --mp-glow: 0 0 0 3px color-mix(in srgb, var(--mp-primary) 35%, transparent),
                 0 0 28px 4px color-mix(in srgb, var(--mp-primary) 60%, transparent);
      scale: 1.04;
      z-index: 2;
    }

    /* Weekend and holiday markers — a ring laid on top of any other variant,
       drawn as box-shadow so border-radius and borders stay intact. The
       weekend ring is neutral; a holiday (declared later) replaces it with amber. */
    .mp-day-weekend {
      --mp-ring: 0 0 0 2px var(--mp-weekend-color),
                 0 0 0 4px color-mix(in srgb, var(--mp-weekend-color) 25%, transparent);
    }
    .mp-day-holiday {
      --mp-ring: 0 0 0 2px var(--mp-holiday-color, #f59e0b),
                 0 0 0 4px color-mix(in srgb, var(--mp-holiday-color, #f59e0b) 25%, transparent);
    }
    :root { --mp-weekend-color: color-mix(in srgb, var(--mp-text) 50%, transparent); }
    .mp-day-holiday-label {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--mp-holiday-color, #f59e0b);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      line-height: 1.1;
      margin-top: 0.1rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* Light mode: use a darker amber/orange for readability on light surfaces */
    :root[data-theme="light"] {
      --mp-holiday-color: #b45309;
    }

    /* Accent color for today's date number */
    .mp-accent { color: var(--mp-primary) !important; }

    .btn {
      border-radius: 0.75rem;
      font-weight: 600;
      padding: 0.55rem 1rem;
      transition: background 0.12s, transform 0.1s;
      cursor: pointer;
      border: none;
      font-size: 0.875rem;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary  { background: var(--mp-primary); color: #fff !important; }
    .btn-primary:hover  { background: color-mix(in srgb, var(--mp-primary) 80%, black); }
    .btn-success  { background: #16a34a; color: #fff !important; }
    .btn-success:hover  { background: #15803d; }
    .btn-warn     { background: #d97706; color: #fff !important; }
    .btn-warn:hover     { background: #b45309; }
    .btn-danger   { background: #dc2626; color: #fff !important; }
    .btn-danger:hover   { background: #b91c1c; }
    .btn-neutral  { background: var(--mp-surface); color: var(--mp-text) !important; border: 1px solid var(--mp-border); }
    .btn-neutral:hover  { background: var(--mp-border); }
    .btn-violet   { background: #7c3aed; color: #fff !important; }
    .btn-violet:hover   { background: #6d28d9; }

    .suggestion-card {
      background: var(--mp-surface);
      border: 1px solid var(--mp-border);
      border-radius: 1rem;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.375rem;
      transition: border-color 0.12s;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .suggestion-card:hover { border-color: var(--mp-text-muted); }
    .suggestion-card .dish-info { min-width: 0; }
    .suggestion-card .dish-actions { display: flex; gap: 0.375rem; }
    .suggestion-card .dish-actions .btn { flex: 1; }

    @media (min-width: 600px) {
      .suggestion-card {
        flex-direction: row;
        align-items: center;
        gap: 0.75rem;
      }
      .suggestion-card .dish-info { flex: 1; }
      .suggestion-card .dish-actions .btn { flex: none; }
    }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 50;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .modal {
      background: var(--mp-surface);
      border-radius: 1.25rem;
      width: 100%; max-width: 720px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 1.1rem 1.25rem;
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      border: 1px solid var(--mp-border);
    }
    .tag {
      display: inline-block;
      border-radius: 9999px;
      padding: 0.15rem 0.6rem;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    /* Semantic tag variants (readable in both light & dark themes) */
    .tag-dish  { background: var(--mp-tag-dish-bg)  !important; color: var(--mp-tag-dish-fg)  !important; }
    .tag-out   { background: var(--mp-tag-out-bg)   !important; color: var(--mp-tag-out-fg)   !important; }
    .tag-order { background: var(--mp-tag-order-bg) !important; color: var(--mp-tag-order-fg) !important; }
    .tag-none  { background: var(--mp-tag-none-bg)  !important; color: var(--mp-tag-none-fg)  !important; }

    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--mp-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
    }

    /* Statistics table */
    .stats-scroll {
      max-height: 55vh;
      overflow-y: auto;
      border: 1px solid var(--mp-border);
      border-radius: 0.75rem;
    }
    .stats-table { width: 100%; border-collapse: collapse; }
    .stats-table th {
      position: sticky; top: 0; z-index: 1;
      background: var(--mp-surface);
      border-bottom: 1px solid var(--mp-border);
      padding: 0.45rem 0.5rem;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--mp-text-muted);
      text-align: left;
    }
    .stats-table th.text-right { text-align: right; }
    .stats-table td { padding: 0.3rem 0.5rem; vertical-align: middle; }
    .stats-table tbody tr + tr td { border-top: 1px solid color-mix(in srgb, var(--mp-border) 50%, transparent); }
    .stats-col-count { width: 34%; }
    .sort-btn {
      font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit;
      background: none; border: none; padding: 0; cursor: pointer; white-space: nowrap;
    }
    .sort-btn:hover { color: var(--mp-text); }

    .divider {
      border-top: 1px solid var(--mp-border);
      margin: 1rem 0;
    }

    /* Tooltip for reject buttons */
    .reject-btn-group {
      display: flex;
      gap: 0.375rem;
      shrink: 0;
    }
  </style>
</head>
<!-- No x-init: Alpine calls the component's init() by itself, a second call loaded everything twice -->
<body x-data="mealPlanner()" x-cloak>

  <!-- Hidden photo picker, shared by the dish list, the place list and the day dialog -->
  <input
    type="file"
    accept="image/*"
    class="hidden"
    x-ref="imageInput"
    @change="onImageSelected($event)"
  />

  <div class="max-w-[1500px] mx-auto px-4 py-5" @keydown.escape.window="handleEscape()">

    <!-- Header -->
    <div class="flex items-center justify-between mb-5 gap-2">
      <div class="min-w-0">
        <h1 class="text-2xl font-bold text-white leading-tight">🍽️ Meal Planner</h1>
        <p class="text-gray-500 text-sm mt-0.5 truncate" x-text="weekLabel"></p>
      </div>
      <div class="flex gap-1.5 shrink-0">
        <button class="btn btn-neutral px-4" @click="loadPlan" x-text="S.today"></button>
      </div>
    </div>

    <!-- Week grid — 2 columns on phones, 4 on narrow tablets, 7 across from 1024px up -->
    <div class="week-grid grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3">
      <template x-for="day in weekDays" :key="day.iso">
        <div
          class="day-card rounded-2xl p-3 flex flex-col"
          :class="dayCardClass(day)"
          :title="holidayName(day)"
          @click="openDay(day)"
        >
          <!-- Photo of the dish or place; how much it is dimmed depends on the day -->
          <div
            class="day-photo"
            x-show="dayImage(day)"
            :style="dayImage(day) ? `background-image:url('${dayImage(day)}')` : ''"
          ></div>

          <div class="day-content flex flex-col gap-1.5 h-full">
            <!-- Date row -->
            <div class="flex items-baseline justify-between gap-1 bubble">
              <!-- Today shows a badge instead of the weekday: fits narrow cards, and everyone knows today's weekday -->
              <span class="today-badge" x-show="day.isToday" x-text="S.today"></span>
              <span class="wd text-sm font-semibold text-gray-400 uppercase tracking-wide" x-show="!day.isToday" x-text="day.weekday"></span>
              <span
                class="daynum text-2xl font-bold leading-none text-white"
                :class="day.isToday ? 'mp-accent' : ''"
                x-text="day.dayNum"
              ></span>
            </div>

            <!-- Holiday label (only shown if it's a holiday) -->
            <p
              class="mp-day-holiday-label"
              x-show="holidayName(day)"
              x-text="holidayName(day)"
            ></p>

            <!-- Meal status, pinned to the bottom of the card -->
            <template x-if="plan[day.iso]">
              <div class="mt-auto">
                <span
                  x-show="!['dish','custom'].includes(plan[day.iso].type)"
                  class="tag" :class="typeTagClass(plan[day.iso].type)" x-text="typeLabel(plan[day.iso].type)"
                ></span>
                <p
                  class="meal text-base font-normal text-white mt-1 leading-snug line-clamp-3 bubble"
                  x-text="plan[day.iso].dish_name || ''"
                  x-show="plan[day.iso].dish_name"
                ></p>
              </div>
            </template>
            <template x-if="!plan[day.iso]">
              <p class="meal text-sm text-gray-600 italic mt-auto" x-text="S.notPlanned"></p>
            </template>
          </div>
        </div>
      </template>
    </div>

    <!-- Footer links -->
    <div class="mt-5 text-center flex items-center justify-center gap-4">
      <button class="text-gray-600 text-xs hover:text-gray-400 underline" @click="openDishManager()" x-text="S.manageDishes"></button>
      <span class="text-gray-700 text-xs">·</span>
      <button class="text-gray-600 text-xs hover:text-gray-400 underline" @click="openStats()" x-text="S.statistics"></button>
      <span class="text-gray-700 text-xs">·</span>
      <a class="text-gray-600 text-xs hover:text-gray-400 underline" href="/api/meal_planner/history.csv" download="meal-history.csv" x-text="S.downloadHistory"></a>
    </div>
  </div>

  <!-- ================================================================
       DAY PLANNING MODAL
  ================================================================ -->
  <div class="modal-overlay" x-show="modalOpen" x-transition @click.self="closeModal">
    <div class="modal" x-show="modalOpen" x-transition>

      <!-- Modal header -->
      <div class="flex items-start justify-between mb-2">
        <div>
          <h2 class="text-lg font-bold text-white leading-tight" x-text="activeDay?.label"></h2>
          <p class="text-gray-500 text-xs mt-0.5" x-text="activeDay ? new Intl.DateTimeFormat(lang, {day:'numeric', month:'long', year:'numeric'}).format(new Date(activeDay.iso + 'T12:00')) : ''"></p>
        </div>
        <button class="text-gray-500 hover:text-white text-2xl leading-none ml-3 shrink-0" @click="closeModal">×</button>
      </div>

      <!-- ── Already planned: show summary + change/delete ── -->
      <template x-if="plan[activeDay?.iso] && !editMode">
        <div>
          <img
            x-show="activeDayImage()"
            :src="activeDayImage()"
            class="w-full h-44 object-cover rounded-xl mb-3"
            alt=""
          />
          <div class="bg-gray-800 rounded-xl p-3.5 mb-3">
            <p class="text-xs text-gray-500 mb-1" x-text="S.currentlyPlanned"></p>
            <span class="tag" :class="typeTagClass(plan[activeDay?.iso]?.type)" x-text="typeLabel(plan[activeDay?.iso]?.type)"></span>
            <span class="ml-2 font-semibold text-white text-sm" x-text="plan[activeDay?.iso]?.dish_name"></span>
          </div>
          <!-- Photo for the dish or the place of this day -->
          <template x-if="activeDayPhotoTarget()">
            <div class="flex items-center gap-2 mb-3">
              <button
                class="btn btn-neutral text-xs shrink-0"
                @click="pickImage(activeDayPhotoTarget())"

    // ── Helpers ───────────────────────────────────────────────────────────────
    const API = '/api/meal_planner';
    const IMAGE_BASE = '/meal_planner_images';

    function isoWeek(date) {
      const d = new Date(date);
      const day = d.getDay() === 0 ? 7 : d.getDay();
      d.setDate(d.getDate() + 4 - day);
      const yearStart = new Date(d.getFullYear(), 0, 1);
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    function getMonday(date) {
      const d = new Date(date);
      const day = d.getDay() === 0 ? 7 : d.getDay();
      d.setDate(d.getDate() - day + 1);
      return d;
    }

    function toISO(date) {
      // Use local date parts to avoid UTC-offset issues at midnight
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // ── Alpine component ──────────────────────────────────────────────────────
    function mealPlanner() {
      return {
        lang: (navigator.language || 'de').startsWith('de') ? 'de' : 'en',
        get S() { return this.lang === 'de' ? STRINGS_DE : STRINGS_EN; },
        get today() { return toISO(new Date()); },

        // Week
        weekDays: [],
        plan: {},
        holidays: {},  // { 'YYYY-MM-DD': 'Holiday Name', ... }
        weekLabel: '',

        // Modal
        modalOpen: false,
        activeDay: null,
        editMode: false,
        suggestions: [],
        loadingSuggestions: false,
        rejecting: false,

        // Surprise
        surpriseResult: null,
        surpriseSource: 'themealdb',
        specialPending: null,
        specialLabel: '',
        surpriseLoading: false,

        // Custom input
        customText: '',
        addToList: false,

        // Statistics
        showStats: false,
        statsData: null,
        statsTab: 'dishes',                        // dishes | eating_out | order
        statsSort: { key: 'count', dir: 'desc' },  // key: name | count | last_used

        // Move / swap
        showMove: false,
        moveDays: [],
        movePlan: {},

        // Dish manager
        showDishManager: false,
        allDishes: [],
        dishIndex: { byId: {}, byName: {} },
        places: [],      // eating-out / order places, with photos and visit counts
        placeIndex: {},  // { type: { lowercased name: place } }
        pendingImage: null,  // { kind: 'dish', dish } or { kind: 'place', type, name }, each with a label
        showCropper: false,
        cropAspect: 1,
        cropBusy: false,
        cropper: null,
        cropObjectUrl: null,
        newDishName: '',
        dishManagerTab: 'list',
        bulkText: '',

        // ── Init ──
        async init() {
          this.applyHATheme();
          try {
            const resp = await fetch('/api/meal_planner/settings');
            if (resp.ok) {
              const s = await resp.json();
              if (s.lang) {
                this.lang = s.lang;
                document.documentElement.lang = s.lang;
              }
            }
          } catch(e) { /* keep browser default */ }
          // Dishes and places carry the photos, so the overview needs them up front
          await Promise.all([this.loadPlan(), this.loadDishes(), this.loadPlaces()]);
        },

        applyHATheme() {
          try {
            if (window.parent !== window) {
              const ps = getComputedStyle(window.parent.document.documentElement);
              const get = v => ps.getPropertyValue(v).trim();
              const r = document.documentElement;
              const map = {
                '--mp-bg':         get('--primary-background-color') || get('--lovelace-background'),
                '--mp-surface':    get('--card-background-color') || get('--secondary-background-color'),
                '--mp-text':       get('--primary-text-color'),
                '--mp-text-muted': get('--secondary-text-color'),
                '--mp-border':     get('--divider-color'),
                '--mp-primary':    get('--primary-color'),
              };
              Object.entries(map).forEach(([k, v]) => { if (v) r.style.setProperty(k, v); });
            }
          } catch(e) { /* cross-origin or standalone – keep dark defaults */ }
          // Always detect light vs dark (works for standalone too)
          this.detectThemeMode();
        },

        detectThemeMode() {
          try {
            // Use a temporary probe element to resolve the actual computed bg color
            const probe = document.createElement('div');
            probe.style.cssText = 'position:absolute;visibility:hidden;background:var(--mp-bg);';
            document.body.appendChild(probe);
            const rgb = getComputedStyle(probe).backgroundColor;
            probe.remove();
            const m = rgb.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
            if (!m) return;
            // Perceived luminance (ITU-R BT.601)
            const lum = (0.299 * +m[1] + 0.587 * +m[2] + 0.114 * +m[3]) / 255;
            document.documentElement.setAttribute('data-theme', lum > 0.55 ? 'light' : 'dark');
          } catch(e) { /* fall back to dark defaults */ }
        },

        async loadPlan() {
          const today = new Date();
          const todayISO = toISO(today);
          const days = [];
          for (let i = -2; i <= 18; i++) {
            const d = new Date(today);
            d.setDate(today.getDate() + i);
            const iso = toISO(d);
            const wi = (d.getDay() + 6) % 7; // 0=Mo … 6=So
            days.push({
              iso,
              weekday: this.S.weekdays[wi],
              weekdayLong: this.S.weekdaysLong[wi],
              dayNum: d.getDate(),
              month: this.S.months[d.getMonth()],
              isToday: iso === todayISO,
              isFuture: iso > todayISO,
              isWeekend: wi >= 5,
              label: `${this.S.weekdaysLong[wi]}, ${d.getDate()}. ${this.S.months[d.getMonth()]}`,
            });
          }
          this.weekDays = days;

          const s = days[0], e = days[days.length - 1];
          this.weekLabel = `${s.dayNum}. ${s.month} – ${e.dayNum}. ${e.month}`;

          const fromIso = days[0].iso;
          const toIso = days[days.length - 1].iso;
          try {
            const resp = await fetch(`${API}/plan?from=${fromIso}&to=${toIso}`);
            this.plan = await resp.json();
          } catch(err) {
            console.error('Failed to load plan', err);
            this.plan = {};
          }
          // Load holidays for the same range — failures are non-fatal
          try {
            const hr = await fetch(`/api/meal_planner/holidays?from=${fromIso}&to=${toIso}`);
            this.holidays = hr.ok ? await hr.json() : {};
          } catch(err) {
            this.holidays = {};
          }
        },

        // ── Day card styles ──
        dayCardClass(day) {
          const p = this.plan[day.iso];
          let base;
          // Today keeps its highlight whatever is planned; the tag tells the rest
          if (day.isToday) base = 'mp-day-today is-today';
          else if (!p) base = 'mp-day-default';
          else if (p.type === 'nothing') base = 'mp-day-nothing';
          else if (p.type === 'dish' || p.type === 'custom') base = 'mp-day-dish';
          else base = 'mp-day-default';
          if (day.isFuture) base += ' is-future';
          if (day.isWeekend) base += ' mp-day-weekend';
          if (this.holidays[day.iso]) base += ' mp-day-holiday';
          if (this.dayImage(day)) base += ' has-photo';
          return base;
        },
        holidayName(day) {
          return this.holidays[day.iso] || '';
        },
        typeTagClass(type) {
          const map = {
            dish:       'tag-dish',
            custom:     'tag-dish',
            eating_out: 'tag-out',
            order:      'tag-order',
            nothing:    'tag-none',
          };
          return map[type] || 'tag-none';
        },
        typeLabel(type) {
          return this.S[`type_${type}`] || type;
        },
        formatDate(iso) {
          if (!iso) return '';
          const [y, m, d] = iso.split('-');
          return `${d}.${m}.${y}`;
        },

        // ── Modal ──
        sortedDishes() {
          return this.allDishes.slice().sort((a, b) => a.name.localeCompare(b.name, this.lang));
        },

        async openDay(day) {
          this.activeDay = day;
          this.editMode = false;
          this.customText = '';
          this.addToList = false;
          this.surpriseResult = null;
          this.suggestions = [];
          this.modalOpen = true;
          this.loadDishes();
          if (!this.plan[day.iso]) {
            await this.loadSuggestions();
          }
        },
        closeModal() {
          this.modalOpen = false;
          this.editMode = false;
          this.surpriseResult = null;
          this.specialPending = null;
          this.specialLabel = '';
          this.showMove = false;
        },
        handleEscape() {
          // Close the topmost layer first
          if (this.showCropper) this.cancelCrop();
          else if (this.showMove) this.showMove = false;
          else if (this.modalOpen) this.closeModal();
          else if (this.showDishManager) this.showDishManager = false;
          else if (this.showStats) this.showStats = false;
        },
        async startEdit() {
          this.editMode = true;
          this.customText = '';
          this.surpriseResult = null;
          this.loadDishes();
          await this.loadSuggestions();
        },

        async loadSuggestions() {
          if (!this.activeDay) return;
          this.loadingSuggestions = true;
          try {
            const resp = await fetch(`${API}/suggest/${this.activeDay.iso}`);
            this.suggestions = await resp.json();
          } catch(e) {
            console.error('Failed to load suggestions', e);
            this.suggestions = [];
          } finally {
            this.loadingSuggestions = false;
          }
        },

        async acceptDish(dish) {
          await this.saveDay({ type: 'dish', dish_id: dish.id, dish_name: dish.name });
        },

        async rejectDish(dish, mode) {
          this.rejecting = true;
          try {
            const resp = await fetch(`${API}/suggest/${this.activeDay.iso}/reject`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ dish_id: dish.id, mode }),
            });
            this.suggestions = await resp.json();
          } catch(e) {
            console.error('Reject failed', e);
          } finally {
            this.rejecting = false;
          }
        },

        toggleSpecialInput(type) {
          if (this.specialPending === type) {
            // Toggle off
            this.specialPending = null;
            this.specialLabel = '';
          } else {
            this.specialPending = type;
            this.specialLabel = '';
            this.$nextTick(() => { this.$refs.specialInput?.focus(); });
          }
        },
        async confirmSpecial() {
          const payload = { type: this.specialPending };
          if (this.specialLabel.trim()) payload.dish_name = this.specialLabel.trim();
          this.specialPending = null;
          this.specialLabel = '';
          await this.saveDay(payload);
        },
        async setSpecial(type) {
          this.specialPending = null;
          this.specialLabel = '';
          await this.saveDay({ type });
        },
        async saveCustom() {
          const name = this.customText.trim();
          if (!name) return;
          await this.saveDay({ type: 'custom', dish_name: name, add_to_list: this.addToList });
        },
        async acceptSurprise() {
          if (!this.surpriseResult) return;
          // Grab both now: saveDay closes the modal and clears surpriseResult
          const { name, thumb } = this.surpriseResult;
          const entry = await this.saveDay({ type: 'custom', dish_name: name, add_to_list: true });
          if (!entry || !entry.dish_id || !thumb) return;
          try {
            // Let the server pull the recipe picture; keep_existing protects
            // a photo the user set themselves on a dish of the same name
            await fetch(`${API}/dishes/${entry.dish_id}/image/fetch`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ url: thumb, keep_existing: true }),
            });
            await this.loadDishes();
          } catch(e) {
            // The meal is planned either way — a missing photo is not worth an alert
            console.warn('Could not adopt the recipe photo', e);
          }
        },

        async saveDay(payload) {
          try {
            const resp = await fetch(`${API}/plan/${this.activeDay.iso}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
            if (!resp.ok) throw new Error(await resp.text());
            const entry = await resp.json();
            this.plan[this.activeDay.iso] = entry;
            this.closeModal();
            this.advanceToNextUnplanned();
            return entry;
          } catch(e) {
            alert(this.S.errorPrefix + e.message);
            return null;
          }
        },

        advanceToNextUnplanned() {
          const currentIdx = this.weekDays.findIndex(d => d.iso === this.activeDay?.iso);
          const after  = this.weekDays.slice(currentIdx + 1).find(d => !this.plan[d.iso]);
          const before = this.weekDays.slice(0, currentIdx).find(d => !this.plan[d.iso]);
          const next = after || before;
          if (next) setTimeout(() => { if (!this.modalOpen) this.openDay(next); }, 220);
        },

        async clearDay(iso) {
          try {
            await fetch(`${API}/plan/${iso}`, { method: 'DELETE' });
            const updated = { ...this.plan };
            delete updated[iso];
            this.plan = updated;
            this.closeModal();
          } catch(e) {
            console.error('Clear failed', e);
          }
        },

        // ── Move / swap ──
        async openMove() {
          if (!this.activeDay) return;
          const base = new Date(this.activeDay.iso + 'T12:00');
          const days = [];
          for (let i = -7; i <= 7; i++) {
            const d = new Date(base);
            d.setDate(base.getDate() + i);
            const iso = toISO(d);
            const wi = (d.getDay() + 6) % 7;
            days.push({
              iso,
              weekday: this.S.weekdays[wi],
              dayNum: d.getDate(),
              isToday: iso === this.today,
            });
          }
          this.moveDays = days;
          this.movePlan = {};
          this.showMove = true;
          // Fetch the plan for the whole window (may extend beyond the loaded range)
          const from = days[0].iso, to = days[days.length - 1].iso;
          try {
            const resp = await fetch(`${API}/plan?from=${from}&to=${to}`);
            if (resp.ok) {
              const raw = await resp.json();
              const clean = {};
              for (const [k, v] of Object.entries(raw)) if (v) clean[k] = v;
              this.movePlan = clean;
            }
          } catch(e) {
            console.error('Failed to load move window', e);
          }
        },
        moveSourceLabel() {
          if (!this.activeDay) return '';
          const p = this.plan[this.activeDay.iso];
          const what = p ? (p.dish_name || this.typeLabel(p.type)) : '';
          return `${this.activeDay.label}${what ? ' · ' + what : ''}`;
        },
        moveEntryText(d) {
          const p = this.movePlan[d.iso];
          if (!p) return '';
          return p.dish_name || this.typeLabel(p.type);
        },
        async doMove(targetIso) {
          if (!this.activeDay || targetIso === this.activeDay.iso) return;
          try {
            const resp = await fetch(`${API}/plan/${this.activeDay.iso}/move`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ target: targetIso }),
            });
            if (!resp.ok) throw new Error(await resp.text());
            this.showMove = false;
            this.closeModal();
            await this.loadPlan();
          } catch(e) {
            alert(this.S.errorPrefix + e.message);
          }
        },

        // ── Surprise me ──
        async surpriseMe(source = 'themealdb') {
          this.surpriseSource = source;
          this.surpriseLoading = true;
          this.surpriseResult = null;
          try {
            if (source === 'chefkoch') {
              const resp = await fetch('/api/meal_planner/surprise/chefkoch');
              if (!resp.ok) throw new Error(this.S.errorNoRecipes);
              const meal = await resp.json();
              this.surpriseResult = {
                name: meal.name,
                thumb: meal.image || null,
                category: 'Chefkoch',
                area: '',
                url: meal.url || null,
              };
            } else {
              const resp = await fetch('https://www.themealdb.com/api/json/v1/1/random.php');
              const data = await resp.json();
              const meal = data?.meals?.[0];
              if (meal) {
                this.surpriseResult = {
                  name: meal.strMeal,
                  thumb: meal.strMealThumb,
                  category: meal.strCategory || '',
                  area: meal.strArea || '',
                  url: null,
                };
              }
            }
          } catch(e) {
            alert(this.S.errorNoRecipes + ': ' + e.message);
          } finally {
            this.surpriseLoading = false;
          }
        },

        // ── Dish manager ──
        async openStats() {
          this.showStats = true;
          this.statsData = null;
          try {
            const resp = await fetch(`${API}/stats`);
            if (resp.ok) this.statsData = await resp.json();
          } catch(e) { console.error('stats fetch failed', e); }
        },
        statsTabs() {
          return [
            { key: 'dishes',     label: this.S.statsCooked,    bar: ['#16a34a', '#22c55e'] },
            { key: 'eating_out', label: this.S.statsEatingOut, bar: ['#d97706', '#f59e0b'] },
            { key: 'order',      label: this.S.statsOrdered,   bar: ['#2563eb', '#3b82f6'] },
          ];
        },
        statsRows() {
          const rows = (this.statsData?.[this.statsTab] || []).slice();
          const byName = (a, b) => a.name.localeCompare(b.name, this.lang);
          const byDate = (a, b) => a.last_used < b.last_used ? -1 : a.last_used > b.last_used ? 1 : 0;
          const primary = {
            name: byName,
            count: (a, b) => a.count - b.count || byDate(a, b),
            last_used: (a, b) => byDate(a, b) || a.count - b.count,
          }[this.statsSort.key];
          const sign = this.statsSort.dir === 'asc' ? 1 : -1;
          return rows.sort((a, b) => sign * primary(a, b) || byName(a, b));
        },
        sortStats(key) {
          // Same column flips the direction; a new column starts where it is most useful
          if (this.statsSort.key === key) {
            this.statsSort = { key, dir: this.statsSort.dir === 'asc' ? 'desc' : 'asc' };
          } else {
            this.statsSort = { key, dir: key === 'name' ? 'asc' : 'desc' };
          }
        },
        sortArrow(key) {
          if (this.statsSort.key !== key) return '';
          return this.statsSort.dir === 'asc' ? ' ▲' : ' ▼';
        },
        statsBarStyle(row) {
          const rows = this.statsData?.[this.statsTab] || [];
          const max = Math.max(1, ...rows.map(r => r.count));
          const [from, to] = this.statsTabs().find(t => t.key === this.statsTab).bar;
          return `width: ${Math.max(8, (row.count / max) * 100)}%; background: linear-gradient(90deg, ${from}, ${to});`;
        },

        async openDishManager() {
          this.showDishManager = true;
          this.dishManagerTab = 'list';
          await this.loadDishes();
        },
        openBulkEdit() {
          this.bulkText = this.allDishes.map(d => d.name).join('\n');
          this.dishManagerTab = 'bulk';
        },
        async saveBulk() {
          const newNames = this.bulkText
            .split('\n')
            .map(l => l.trim())
            .filter(l => l.length > 0);

          if (newNames.length === 0 && !confirm(this.S.confirmDeleteAllDishes)) return;

          const existing = new Map(this.allDishes.map(d => [d.name.toLowerCase(), d]));
          const incoming = new Set(newNames.map(n => n.toLowerCase()));

          // Add new
          for (const name of newNames) {
            if (!existing.has(name.toLowerCase())) {
              await fetch(`${API}/dishes`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name }),
              });
            }
          }
          // Remove deleted
          for (const [key, dish] of existing) {
            if (!incoming.has(key)) {
              await fetch(`${API}/dishes/${dish.id}`, { method: 'DELETE' });
            }
          }

          await this.loadDishes();
          this.dishManagerTab = 'list';
        },
        async loadDishes() {
          try {
            const resp = await fetch(`${API}/dishes`);
            this.allDishes = await resp.json();
            this.rebuildDishIndex();
          } catch(e) {
            console.error('Failed to load dishes', e);
          }
        },

        // ── Dish photos ──
        rebuildDishIndex() {
          // Lookup tables so the overview can resolve a photo per card cheaply
          const byId = {}, byName = {};
          for (const d of this.allDishes) {
            byId[d.id] = d;
            byName[d.name.toLowerCase()] = d;
          }
          this.dishIndex = { byId, byName };
        },
        dishFor(entry) {
          if (!entry) return null;
          const idx = this.dishIndex;
          return idx.byId[entry.dish_id]
            || (entry.dish_name ? idx.byName[entry.dish_name.trim().toLowerCase()] : null)
            || null;
        },
        imageUrl(record) {
          return record && record.image ? `${IMAGE_BASE}/${record.image}` : '';
        },

        // ── Place photos (eating out / order) ──
        async loadPlaces() {
          try {
            const resp = await fetch(`${API}/places`);
            if (!resp.ok) return;
            this.places = await resp.json();
            const index = {};
            for (const p of this.places) {
              (index[p.type] ||= {})[p.name.trim().toLowerCase()] = p;
            }
            this.placeIndex = index;
          } catch(e) {
            console.error('Failed to load places', e);
          }
        },
        placeRecord(type, name) {
          return this.placeIndex[type]?.[(name || '').trim().toLowerCase()] || null;
        },
        placeFor(entry) {
          // The place's own photo, otherwise the default photo of its type
          const own = this.placeRecord(entry.type, entry.dish_name);
          if (own?.image) return own;
          const fallback = this.placeRecord(entry.type, '');
          return fallback?.image ? fallback : null;
        },
        placeLabel(type, name) {
          return name || `${this.typeLabel(type)} · ${this.S.placeDefault}`;
        },
        placesOfType(type) {
          // Default row first, then the most visited
          return this.places
            .filter(p => p.type === type)
            .sort((a, b) => (b.name === '') - (a.name === '')
              || b.count - a.count
              || a.name.localeCompare(b.name, this.lang));
        },

        dayImage(day) {
          const entry = this.plan[day.iso];
          if (!entry) return '';
          if (['dish', 'custom'].includes(entry.type)) return this.imageUrl(this.dishFor(entry));
          if (['eating_out', 'order'].includes(entry.type)) return this.imageUrl(this.placeFor(entry));
          return '';
        },
        activeDayImage() {
          return this.activeDay ? this.dayImage(this.activeDay) : '';
        },
        activeDayPhotoTarget() {
          // What a photo picked in the day dialog belongs to: the dish, or the place
          const entry = this.activeDay && this.plan[this.activeDay.iso];
          if (!entry) return null;
          if (['dish', 'custom'].includes(entry.type)) {
            const dish = this.dishFor(entry);
            return dish ? { kind: 'dish', dish, label: dish.name, hasOwn: !!dish.image } : null;
          }
          if (['eating_out', 'order'].includes(entry.type)) {
            const name = (entry.dish_name || '').trim();
            return {
              kind: 'place', type: entry.type, name,
              label: this.placeLabel(entry.type, name),
              hasOwn: !!this.placeRecord(entry.type, name)?.image,
            };
          }
          return null;
        },

        // ── Photo picking, shared by dishes and places ──
        pickImage(target) {
          this.pendingImage = target;
          this.$refs.imageInput.value = '';
          this.$refs.imageInput.click();
        },
        pickDishImage(dish) {
          this.pickImage({ kind: 'dish', dish, label: dish.name });
        },
        pickPlaceImage(place) {
          this.pickImage({
            kind: 'place', type: place.type, name: place.name,
            label: this.placeLabel(place.type, place.name),
          });
        },
        async onImageSelected(event) {
          const file = event.target.files && event.target.files[0];
          event.target.value = '';
          if (!file || !this.pendingImage) {
            this.pendingImage = null;
            return;
          }
          if (typeof window.Cropper === 'undefined') {
            // Cropper did not load — upload uncropped rather than blocking the user
            const target = this.pendingImage;
            this.pendingImage = null;
            try {
              await this.uploadImage(target, await this.downscaleImage(file, 1000, 0.82));
            } catch(e) {
              alert(this.S.errorPrefix + (e.message || e));
            }
            return;
          }
          this.openCropper(file);
        },
        async uploadImage(target, blob) {
          let url;
          if (target.kind === 'dish') {
            url = `${API}/dishes/${target.dish.id}/image`;
          } else {
            // The place record is created only now, so a cancelled pick leaves nothing behind
            const resp = await fetch(`${API}/places`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ type: target.type, name: target.name }),
            });
            if (!resp.ok) throw new Error(await resp.text());
            url = `${API}/places/${(await resp.json()).id}/image`;
          }
          const resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'image/jpeg' },
            body: blob,
          });
          if (!resp.ok) throw new Error(await resp.text());
          await (target.kind === 'dish' ? this.loadDishes() : this.loadPlaces());
        },
        async removePlaceImage(place) {
          if (!place.id) return;
          try {
            await fetch(`${API}/places/${place.id}/image`, { method: 'DELETE' });
            await this.loadPlaces();
          } catch(e) {
            console.error('Remove photo failed', e);
          }
        },

        // ── Crop dialog ──
        openCropper(file) {
          this.cropBusy = false;
          this.cropAspect = 1;
          this.destroyCropper();
          if (this.cropObjectUrl) URL.revokeObjectURL(this.cropObjectUrl);
          this.cropObjectUrl = URL.createObjectURL(file);
          this.showCropper = true;
          // Deliberately not $nextTick: Alpine holds those callbacks while an
          // x-transition runs, and that transition depends on requestAnimationFrame,
          // which stalls in a background tab. startCropper retries until laid out.
          setTimeout(() => this.startCropper(0), 0);
        },
        startCropper(attempt) {
          const img = this.$refs.cropImage;
          if (!img || !this.cropObjectUrl) {
            // The modal may not be laid out yet — retry rather than fail silently
            if (attempt < 20) {
              setTimeout(() => this.startCropper(attempt + 1), 50);
            } else {
              console.error('Crop dialog: image element never became available');
              alert(this.S.errorPrefix + this.S.imageReadFailed);
              this.cancelCrop();
            }
            return;
          }
          try {
            img.src = this.cropObjectUrl;
            this.destroyCropper();
            this.cropper = new Cropper(img, {
              aspectRatio: this.cropAspect,
              viewMode: 1,
              autoCropArea: 1,
              background: false,
              responsive: true,
              checkOrientation: true,  // respect the EXIF rotation of phone photos
            });
          } catch(e) {
            console.error('Crop dialog failed to start', e);
            alert(this.S.errorPrefix + (e.message || e));
            this.cancelCrop();
          }
        },
        destroyCropper() {
          if (this.cropper) {
            this.cropper.destroy();
            this.cropper = null;
          }
        },
        setCropAspect(aspect) {
          this.cropAspect = aspect;
          if (this.cropper) this.cropper.setAspectRatio(aspect === null ? NaN : aspect);
        },
        rotateCrop(degrees) {
          if (this.cropper) this.cropper.rotate(degrees);
        },
        cancelCrop() {
          this.showCropper = false;
          this.cropBusy = false;
          this.destroyCropper();
          if (this.cropObjectUrl) {
            URL.revokeObjectURL(this.cropObjectUrl);
            this.cropObjectUrl = null;
          }
          this.pendingImage = null;
        },
        async applyCrop() {
          const target = this.pendingImage;
          if (!this.cropper || !target) return;
          this.cropBusy = true;
          try {
            // Capped here, so a 40 MP original never leaves the browser full size
            const canvas = this.cropper.getCroppedCanvas({
              maxWidth: 1000,
              maxHeight: 1000,
              imageSmoothingQuality: 'high',
              fillColor: '#000',
            });
            if (!canvas) throw new Error(this.S.imageEncodeFailed);
            const blob = await new Promise((resolve, reject) => canvas.toBlob(
              b => b ? resolve(b) : reject(new Error(this.S.imageEncodeFailed)),
              'image/jpeg',
              0.82
            ));
            await this.uploadImage(target, blob);
            this.cancelCrop();
          } catch(e) {
            alert(this.S.errorPrefix + (e.message || e));
            this.cropBusy = false;
          }
        },
        downscaleImage(file, maxSize, quality) {
          // Resize in the browser so the backend needs no image library
          return new Promise((resolve, reject) => {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
              URL.revokeObjectURL(url);
              const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
              const canvas = document.createElement('canvas');
              canvas.width = Math.max(1, Math.round(img.width * scale));
              canvas.height = Math.max(1, Math.round(img.height * scale));
              canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
              canvas.toBlob(
                b => b ? resolve(b) : reject(new Error(this.S.imageEncodeFailed)),
                'image/jpeg',
                quality
              );
            };
            img.onerror = () => {
              URL.revokeObjectURL(url);
              reject(new Error(this.S.imageReadFailed));
            };
            img.src = url;
          });
        },
        async removeDishImage(dish) {
          try {
            await fetch(`${API}/dishes/${dish.id}/image`, { method: 'DELETE' });
            await this.loadDishes();
          } catch(e) {
            console.error('Remove photo failed', e);
          }
        },
        async addDish() {
          const name = this.newDishName.trim();
          if (!name) return;
          try {
            const resp = await fetch(`${API}/dishes`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name }),
            });
            if (resp.status === 409) { alert(this.S.dishAlreadyExists); return; }
            if (!resp.ok) throw new Error(await resp.text());
            this.newDishName = '';
            await this.loadDishes();
          } catch(e) {
            alert(this.S.errorPrefix + e.message);
          }
        },
        async deleteDish(id) {
          if (!confirm(this.S.confirmDeleteDish)) return;
          try {
            await fetch(`${API}/dishes/${id}`, { method: 'DELETE' });
            await this.loadDishes();
          } catch(e) {
            console.error('Delete failed', e);
          }
        },
        async unblockDish(dish) {
          try {
            const resp = await fetch(`${API}/dishes/${dish.id}/unblock`, { method: 'POST' });
            if (resp.ok) await this.loadDishes();
          } catch(e) {
            console.error('Unblock failed', e);
          }
        },
      };
    }
  </script>
</body>
</html>
