<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Meal Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }

    /* ── HA Theme CSS variables (defaults = dark; overridden by applyHATheme()) ── */
    :root {
      --mp-bg:         #111827;
      --mp-surface:    #1f2937;
      --mp-text:       #f9fafb;
      --mp-text-muted: #6b7280;
      --mp-border:     #374151;
      --mp-primary:    #2563eb;

      /* Theme-adaptive surfaces & accents (dark defaults) */
      --mp-surface-2:  color-mix(in srgb, var(--mp-bg) 50%, var(--mp-surface));
      --mp-surface-3:  var(--mp-bg);
      --mp-input-bg:   color-mix(in srgb, var(--mp-bg) 40%, var(--mp-surface));

      --mp-accent-green: #4ade80;
      --mp-accent-amber: #fbbf24;
      --mp-accent-blue:  #60a5fa;
      --mp-accent-red:   #f87171;
      --mp-accent-violet:#a78bfa;

      /* Tag bubbles — dark mode: saturated dark bg with light text */
      --mp-tag-dish-bg:  rgba(22,163,74,0.22);
      --mp-tag-dish-fg:  #86efac;
      --mp-tag-out-bg:   rgba(217,119,6,0.22);
      --mp-tag-out-fg:   #fcd34d;
      --mp-tag-order-bg: rgba(37,99,235,0.22);
      --mp-tag-order-fg: #93c5fd;
      --mp-tag-none-bg:  color-mix(in srgb, var(--mp-text-muted) 25%, transparent);
      --mp-tag-none-fg:  var(--mp-text-muted);

      /* Surprise result box */
      --mp-violet-bg:     rgba(124,58,237,0.14);
      --mp-violet-border: rgba(124,58,237,0.45);
    }

    /* Light mode overrides (set by JS when luminance of --mp-bg is high) */
    :root[data-theme="light"] {
      --mp-surface-2:  color-mix(in srgb, var(--mp-bg) 55%, var(--mp-surface));
      --mp-surface-3:  color-mix(in srgb, var(--mp-bg) 75%, var(--mp-surface));
      --mp-input-bg:   color-mix(in srgb, var(--mp-bg) 70%, var(--mp-surface));

      --mp-accent-green: #15803d;
      --mp-accent-amber: #b45309;
      --mp-accent-blue:  #1d4ed8;
      --mp-accent-red:   #b91c1c;
      --mp-accent-violet:#6d28d9;

      --mp-tag-dish-bg:  #dcfce7;
      --mp-tag-dish-fg:  #166534;
      --mp-tag-out-bg:   #fef3c7;
      --mp-tag-out-fg:   #92400e;
      --mp-tag-order-bg: #dbeafe;
      --mp-tag-order-fg: #1e40af;
      --mp-tag-none-bg:  #e5e7eb;
      --mp-tag-none-fg:  #4b5563;

      --mp-violet-bg:     #f5f3ff;
      --mp-violet-border: #c4b5fd;
    }

    body {
      background: var(--mp-bg);
      color: var(--mp-text);
      font-family: ui-sans-serif, system-ui, sans-serif;
      min-height: 100vh;
    }

    /* Map Tailwind's static color classes to theme variables */
    body .text-white                    { color: var(--mp-text)       !important; }
    body .text-gray-400,
    body .text-gray-500                 { color: var(--mp-text-muted) !important; }
    body .text-gray-600,
    body .text-gray-700                 { color: color-mix(in srgb, var(--mp-text-muted) 55%, transparent) !important; }

    /* Theme-adaptive surfaces (Tailwind utility overrides) */
    body .bg-gray-700                   { background-color: var(--mp-surface)   !important; }
    body .bg-gray-800                   { background-color: var(--mp-surface-2) !important; }
    body .bg-gray-900                   { background-color: var(--mp-surface-3) !important; }
    body .border-gray-600,
    body .border-gray-700               { border-color: var(--mp-border) !important; }

    /* Accent text colors adapt to theme (readable on both light & dark bg) */
    body .text-green-400                { color: var(--mp-accent-green)  !important; }
    body .text-amber-400                { color: var(--mp-accent-amber)  !important; }
    body .text-blue-400                 { color: var(--mp-accent-blue)   !important; }
    body .text-red-400                  { color: var(--mp-accent-red)    !important; }
    body .text-violet-400               { color: var(--mp-accent-violet) !important; }

    /* Form inputs: adapt bg when dark-gray is used as input bg */
    body input.bg-gray-800,
    body select.bg-gray-800,
    body textarea.bg-gray-800           { background-color: var(--mp-input-bg) !important; color: var(--mp-text) !important; }
    body input::placeholder,
    body select::placeholder,
    body textarea::placeholder          { color: var(--mp-text-muted) !important; opacity: 0.7; }

    /* Surprise result box */
    body .bg-violet-950                 { background-color: var(--mp-violet-bg)     !important; }
    body .border-violet-700             { border-color:      var(--mp-violet-border) !important; }

    /* Stats bar: text inside the colored gradient stays white in both modes */
    .bar-fill .text-white               { color: #fff !important; }

    /* Hover-state color overrides (Tailwind generates .hover\:text-*) */
    body .hover\:text-white:hover,
    body .hover\:text-gray-300:hover,
    body .hover\:text-gray-400:hover    { color: var(--mp-text) !important; }
    body .hover\:text-red-400:hover     { color: var(--mp-accent-red) !important; }

    .day-card {
      transition: transform 0.1s, box-shadow 0.1s;
      cursor: pointer;
    }
    .day-card:hover  { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
    .day-card:active { transform: scale(0.97); }

    /* Day card theme variants */
    .mp-day-default { background: var(--mp-surface); border: 1px solid var(--mp-border); }
    .mp-day-today   {
      background: color-mix(in srgb, var(--mp-primary) 25%, var(--mp-surface));
      border: 1px solid color-mix(in srgb, var(--mp-primary) 55%, transparent);
    }
    .mp-day-nothing { background: var(--mp-bg); border: 1px solid var(--mp-border); opacity: 0.6; }
    .mp-day-dish    { background: var(--mp-surface); border: 1px solid rgba(34,197,94,0.4); }

    /* Holiday marker — amber ring laid on top of any other day variant.
       Uses box-shadow so border-radius and existing borders stay intact. */
    .mp-day-holiday {
      box-shadow: 0 0 0 2px var(--mp-holiday-color, #f59e0b),
                  0 0 0 4px color-mix(in srgb, var(--mp-holiday-color, #f59e0b) 25%, transparent);
    }
    .mp-day-holiday-label {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--mp-holiday-color, #f59e0b);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      line-height: 1.1;
      margin-top: 0.1rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* Light mode: use a darker amber/orange for readability on light surfaces */
    :root[data-theme="light"] {
      --mp-holiday-color: #b45309;
    }

    /* Accent color for today's date number */
    .mp-accent { color: var(--mp-primary) !important; }

    .btn {
      border-radius: 0.75rem;
      font-weight: 600;
      padding: 0.55rem 1rem;
      transition: background 0.12s, transform 0.1s;
      cursor: pointer;
      border: none;
      font-size: 0.875rem;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary  { background: var(--mp-primary); color: #fff !important; }
    .btn-primary:hover  { background: color-mix(in srgb, var(--mp-primary) 80%, black); }
    .btn-success  { background: #16a34a; color: #fff !important; }
    .btn-success:hover  { background: #15803d; }
    .btn-warn     { background: #d97706; color: #fff !important; }
    .btn-warn:hover     { background: #b45309; }
    .btn-danger   { background: #dc2626; color: #fff !important; }
    .btn-danger:hover   { background: #b91c1c; }
    .btn-neutral  { background: var(--mp-surface); color: var(--mp-text) !important; border: 1px solid var(--mp-border); }
    .btn-neutral:hover  { background: var(--mp-border); }
    .btn-violet   { background: #7c3aed; color: #fff !important; }
    .btn-violet:hover   { background: #6d28d9; }

    .suggestion-card {
      background: var(--mp-surface);
      border: 1px solid var(--mp-border);
      border-radius: 1rem;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.375rem;
      transition: border-color 0.12s;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .suggestion-card:hover { border-color: var(--mp-text-muted); }
    .suggestion-card .dish-info { min-width: 0; }
    .suggestion-card .dish-actions { display: flex; gap: 0.375rem; }
    .suggestion-card .dish-actions .btn { flex: 1; }

    @media (min-width: 600px) {
      .suggestion-card {
        flex-direction: row;
        align-items: center;
        gap: 0.75rem;
      }
      .suggestion-card .dish-info { flex: 1; }
      .suggestion-card .dish-actions .btn { flex: none; }
    }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 50;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .modal {
      background: var(--mp-surface);
      border-radius: 1.25rem;
      width: 100%; max-width: 720px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 1.1rem 1.25rem;
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      border: 1px solid var(--mp-border);
    }
    .tag {
      display: inline-block;
      border-radius: 9999px;
      padding: 0.15rem 0.6rem;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    /* Semantic tag variants (readable in both light & dark themes) */
    .tag-dish  { background: var(--mp-tag-dish-bg)  !important; color: var(--mp-tag-dish-fg)  !important; }
    .tag-out   { background: var(--mp-tag-out-bg)   !important; color: var(--mp-tag-out-fg)   !important; }
    .tag-order { background: var(--mp-tag-order-bg) !important; color: var(--mp-tag-order-fg) !important; }
    .tag-none  { background: var(--mp-tag-none-bg)  !important; color: var(--mp-tag-none-fg)  !important; }

    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--mp-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
    }

    .divider {
      border-top: 1px solid var(--mp-border);
      margin: 1rem 0;
    }

    /* Tooltip for reject buttons */
    .reject-btn-group {
      display: flex;
      gap: 0.375rem;
      shrink: 0;
    }
  </style>
</head>
<body x-data="mealPlanner()" x-init="init()" x-cloak>

  <div class="max-w-4xl mx-auto px-3 py-4">

    <!-- Header -->
    <div class="flex items-center justify-between mb-4 gap-2">
      <div class="min-w-0">
        <h1 class="text-xl font-bold text-white leading-tight">🍽️ Meal Planner</h1>
        <p class="text-gray-500 text-xs mt-0.5 truncate" x-text="weekLabel"></p>
      </div>
      <div class="flex gap-1.5 shrink-0">
        <button class="btn btn-neutral px-3" @click="loadPlan" x-text="S.today"></button>
      </div>
    </div>

    <!-- Week grid — 1 col on small, 3 col on medium+, 4 col on large -->
    <div class="grid grid-cols-2 sm:grid-cols-7 gap-2.5">
      <template x-for="day in weekDays" :key="day.iso">
        <div
          class="day-card rounded-2xl px-3.5 py-4 flex flex-col gap-2"
          :class="dayCardClass(day)"
          :title="holidayName(day)"
          @click="openDay(day)"
        >
          <!-- Date row -->
          <div class="flex items-baseline justify-between">
            <span class="text-xs font-semibold text-gray-400 uppercase tracking-wide" x-text="day.weekday"></span>
            <span
              class="text-lg font-bold leading-none"
              :class="day.isToday ? 'mp-accent' : ''"
              x-text="day.dayNum"
            ></span>
          </div>

          <!-- Holiday label (only shown if it's a holiday) -->
          <p
            class="mp-day-holiday-label"
            x-show="holidayName(day)"
            x-text="holidayName(day)"
          ></p>

          <!-- Meal status -->
          <template x-if="plan[day.iso]">
            <div>
              <span
                x-show="!['dish','custom'].includes(plan[day.iso].type)"
                class="tag" :class="typeTagClass(plan[day.iso].type)" x-text="typeLabel(plan[day.iso].type)"
              ></span>
              <p
                class="text-sm font-normal text-white mt-1 leading-tight line-clamp-2"
                x-text="plan[day.iso].dish_name || ''"
                x-show="plan[day.iso].dish_name"
              ></p>
            </div>
          </template>
          <template x-if="!plan[day.iso]">
            <p class="text-xs text-gray-600 italic" x-text="S.notPlanned"></p>
          </template>
        </div>
      </template>
    </div>

    <!-- Footer links -->
    <div class="mt-5 text-center flex items-center justify-center gap-4">
      <button class="text-gray-600 text-xs hover:text-gray-400 underline" @click="openDishManager()" x-text="S.manageDishes"></button>
      <span class="text-gray-700 text-xs">·</span>
      <button class="text-gray-600 text-xs hover:text-gray-400 underline" @click="openStats()" x-text="S.statistics"></button>
      <span class="text-gray-700 text-xs">·</span>
      <a class="text-gray-600 text-xs hover:text-gray-400 underline" href="/api/meal_planner/history.csv" download="meal-history.csv" x-text="S.downloadHistory"></a>
    </div>
  </div>

  <!-- ================================================================
       DAY PLANNING MODAL
  ================================================================ -->
  <div class="modal-overlay" x-show="modalOpen" x-transition @click.self="closeModal">
    <div class="modal" x-show="modalOpen" x-transition>

      <!-- Modal header -->
      <div class="flex items-start justify-between mb-2">
        <div>
          <h2 class="text-lg font-bold text-white leading-tight" x-text="activeDay?.label"></h2>
          <p class="text-gray-500 text-xs mt-0.5" x-text="activeDay ? new Intl.DateTimeFormat(lang, {day:'numeric', month:'long', year:'numeric'}).format(new Date(activeDay.iso + 'T12:00')) : ''"></p>
        </div>
        <button class="text-gray-500 hover:text-white text-2xl leading-none ml-3 shrink-0" @click="closeModal">×</button>
      </div>

      <!-- ── Already planned: show summary + change/delete ── -->
      <template x-if="plan[activeDay?.iso] && !editMode">
        <div>
          <div class="bg-gray-800 rounded-xl p-3.5 mb-3">
            <p class="text-xs text-gray-500 mb-1" x-text="S.currentlyPlanned"></p>
            <span class="tag" :class="typeTagClass(plan[activeDay?.iso]?.type)" x-text="typeLabel(plan[activeDay?.iso]?.type)"></span>
            <span class="ml-2 font-semibold text-white text-sm" x-text="plan[activeDay?.iso]?.dish_name"></span>
          </div>
          <div class="flex gap-2">
            <button class="btn btn-neutral flex-1" @click="startEdit()" x-text="S.change"></button>
            <button class="btn btn-danger" @click="clearDay(activeDay.iso)" x-text="S.delete"></button>
          </div>
          <button
            class="mt-3 w-full text-center text-xs text-gray-500 hover:text-gray-300 underline"
            @click="openMove()"
            x-text="S.moveSwap"
          ></button>
        </div>
      </template>

      <!-- ── Planning UI ── -->
      <template x-if="!plan[activeDay?.iso] || editMode">
        <div>

          <!-- Loading -->
          <template x-if="loadingSuggestions">
            <div class="text-center py-8 text-gray-500">
              <div class="text-3xl mb-2">⏳</div>
              <p x-text="S.loadingSuggestions"></p>
            </div>
          </template>

          <template x-if="!loadingSuggestions">
            <div>

              <!-- Custom entry + dish picker -->
              <p class="section-label" style="margin-bottom:0.25rem" x-text="S.ownEntry"></p>
              <div class="flex gap-2 mb-2">
                <input
                  type="text"
                  x-model="customText"
                  :placeholder="S.ownEntryPlaceholder"
                  class="flex-1 min-w-0 bg-gray-800 border border-gray-600 rounded-xl px-3 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 text-sm"
                  @keydown.enter="customText.trim() && saveCustom()"
                />
                <select
                  class="flex-1 min-w-0 bg-gray-800 border border-gray-600 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-blue-500 text-sm"
                  @change="if ($event.target.value) { customText = $event.target.value; $event.target.selectedIndex = 0; }"
                >
                  <option value="" x-text="S.dishPickerPlaceholder"></option>
                  <template x-for="dish in sortedDishes()" :key="dish.id">
                    <option :value="dish.name" x-text="dish.name"></option>
                  </template>
                </select>
              </div>
              <label class="flex items-center gap-2 mb-2 cursor-pointer">
                <input type="checkbox" x-model="addToList" class="w-4 h-4 rounded accent-blue-500" />
                <span class="text-xs text-gray-400" x-text="S.addToListLabel"></span>
              </label>
              <button
                class="btn btn-primary w-full mb-2"
                :disabled="!customText.trim()"
                @click="saveCustom()"
                x-text="S.save"
              ></button>

              <div class="divider" style="margin:0.5rem 0"></div>

              <!-- Quick-select -->
              <p class="section-label" style="margin-bottom:0.25rem" x-text="S.quickSelect"></p>
              <div class="grid grid-cols-3 gap-2 mb-2">
                <button class="btn btn-neutral flex flex-col items-center gap-1 py-2.5" @click="setSpecial('nothing')">
                  <span class="text-xl">🚫</span>
                  <span class="text-xs" x-text="S.nothing"></span>
                </button>
                <button
                  class="btn flex flex-col items-center gap-1 py-2.5"
                  :class="specialPending === 'eating_out' ? 'btn-warn ring-2 ring-amber-400' : 'btn-warn'"
                  @click="toggleSpecialInput('eating_out')"
                >
                  <span class="text-xl">🍽️</span>
                  <span class="text-xs" x-text="S.eatingOut"></span>
                </button>
                <button
                  class="btn flex flex-col items-center gap-1 py-2.5"
                  :class="specialPending === 'order' ? 'btn-primary ring-2 ring-blue-400' : 'btn-primary'"
                  @click="toggleSpecialInput('order')"
                >
                  <span class="text-xl">📦</span>
                  <span class="text-xs" x-text="S.order"></span>
                </button>
              </div>
              <!-- Optional label input for eating_out / order -->
              <template x-if="specialPending">
                <div class="flex gap-2 mb-2">
                  <input
                    type="text"
                    x-model="specialLabel"
                    :placeholder="S.specialLabelPlaceholder"
                    class="flex-1 min-w-0 bg-gray-800 border border-gray-600 rounded-xl px-3 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 text-sm"
                    @keydown.enter="confirmSpecial()"
                    x-ref="specialInput"
                  />
                  <button class="btn btn-success text-sm" @click="confirmSpecial()" x-text="S.save"></button>
                </div>
              </template>

              <div class="divider" style="margin:0.5rem 0"></div>

              <!-- Suggestions -->
              <p class="section-label" style="margin-bottom:0.25rem" x-text="S.suggestionsLabel"></p>

              <template x-for="dish in suggestions" :key="dish.id">
                <div class="suggestion-card">
                  <!-- Dish info -->
                  <div class="dish-info">
                    <p class="font-semibold text-white text-sm leading-snug" x-text="dish.name"></p>
                    <p class="text-xs text-gray-500"
                      x-text="dish.last_used
                        ? S.lastCooked + ' ' + formatDate(dish.last_used)
                        : S.neverCooked"
                    ></p>
                  </div>
                  <!-- Action buttons inline -->
                  <div class="dish-actions">
                    <button
                      class="btn btn-success text-xs"
                      @click="acceptDish(dish)"
                      :title="S.acceptTitle"
                    >✓ <span x-text="S.accept"></span></button>
                    <button
                      class="btn btn-neutral text-xs"
                      @click="rejectDish(dish, 'session')"
                      :disabled="rejecting"
                      :title="S.notTodayTitle"
                    >↷ <span x-text="S.notToday"></span></button>
                    <button
                      class="btn btn-danger text-xs"
                      @click="rejectDish(dish, 'temporary')"
                      :disabled="rejecting"
                      :title="S.blockTitle"
                    >✕ <span x-text="S.block"></span></button>
                  </div>
                </div>
              </template>

              <template x-if="suggestions.length === 0">
                <p class="text-gray-500 italic text-sm py-2 text-center" x-text="S.noMoreSuggestions"></p>
              </template>

              <div class="divider" style="margin:0.5rem 0"></div>

              <!-- Surprise me -->
              <div class="flex gap-2 mb-2">
                <button
                  class="btn btn-violet flex-1 flex items-center justify-center gap-1.5"
                  @click="surpriseMe('themealdb')"
                  :disabled="surpriseLoading"
                >
                  <span x-show="!surpriseLoading">🎲 <span x-text="S.surpriseMe"></span></span>
                  <span x-show="surpriseLoading">⏳</span>
                </button>
                <button
                  class="btn btn-violet flex-1 flex items-center justify-center gap-1.5"
                  @click="surpriseMe('chefkoch')"
                  :disabled="surpriseLoading"
                >
                  <span x-show="!surpriseLoading">👨‍🍳 Chefkoch</span>
                  <span x-show="surpriseLoading">⏳</span>
                </button>
              </div>

              <!-- Surprise result -->
              <template x-if="surpriseResult">
                <div class="bg-violet-950 border border-violet-700 rounded-xl p-3 mb-3">
                  <div class="flex items-center gap-3 mb-2.5">
                    <img
                      x-show="surpriseResult.thumb"
                      :src="surpriseResult.thumb"
                      class="w-12 h-12 rounded-lg object-cover shrink-0"
                      alt=""
                    />
                    <div class="min-w-0">
                      <p class="font-semibold text-white text-sm" x-text="surpriseResult.name"></p>
                      <p class="text-xs text-gray-400" x-text="surpriseResult.category + (surpriseResult.area ? ' · ' + surpriseResult.area : '')"></p>
                      <a
                        x-show="surpriseResult.url"
                        :href="surpriseResult.url"
                        target="_blank"
                        class="text-xs text-blue-400 hover:underline"
                        x-text="S.viewRecipe"
                      ></a>
                    </div>
                  </div>
                  <div class="flex gap-2">
                    <button class="btn btn-success flex-1 text-sm" @click="acceptSurprise" x-text="S.accept + ' + ' + S.addToList"></button>

    // ── Helpers ───────────────────────────────────────────────────────────────
    const API = '/api/meal_planner';

    function isoWeek(date) {
      const d = new Date(date);
      const day = d.getDay() === 0 ? 7 : d.getDay();
      d.setDate(d.getDate() + 4 - day);
      const yearStart = new Date(d.getFullYear(), 0, 1);
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    function getMonday(date) {
      const d = new Date(date);
      const day = d.getDay() === 0 ? 7 : d.getDay();
      d.setDate(d.getDate() - day + 1);
      return d;
    }

    function toISO(date) {
      // Use local date parts to avoid UTC-offset issues at midnight
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // ── Alpine component ──────────────────────────────────────────────────────
    function mealPlanner() {
      return {
        lang: (navigator.language || 'de').startsWith('de') ? 'de' : 'en',
        get S() { return this.lang === 'de' ? STRINGS_DE : STRINGS_EN; },
        setLang(l) {
          this.lang = l;
          document.documentElement.lang = l;
          this.loadPlan();
        },
        get today() { return toISO(new Date()); },

        // Week
        weekDays: [],
        plan: {},
        holidays: {},  // { 'YYYY-MM-DD': 'Holiday Name', ... }
        weekLabel: '',

        // Modal
        modalOpen: false,
        activeDay: null,
        editMode: false,
        suggestions: [],
        loadingSuggestions: false,
        rejecting: false,

        // Surprise
        surpriseResult: null,
        surpriseSource: 'themealdb',
        specialPending: null,
        specialLabel: '',
        surpriseLoading: false,

        // Custom input
        customText: '',
        addToList: false,

        // Statistics
        showStats: false,
        statsData: null,

        // Move / swap
        showMove: false,
        moveDays: [],
        movePlan: {},

        // Dish manager
        showDishManager: false,
        allDishes: [],
        newDishName: '',
        dishManagerTab: 'list',
        bulkText: '',

        // ── Init ──
        async init() {
          this.applyHATheme();
          try {
            const resp = await fetch('/api/meal_planner/settings');
            if (resp.ok) {
              const s = await resp.json();
              if (s.lang) {
                this.lang = s.lang;
                document.documentElement.lang = s.lang;
              }
            }
          } catch(e) { /* keep browser default */ }
          await this.loadPlan();
        },

        applyHATheme() {
          try {
            if (window.parent !== window) {
              const ps = getComputedStyle(window.parent.document.documentElement);
              const get = v => ps.getPropertyValue(v).trim();
              const r = document.documentElement;
              const map = {
                '--mp-bg':         get('--primary-background-color') || get('--lovelace-background'),
                '--mp-surface':    get('--card-background-color') || get('--secondary-background-color'),
                '--mp-text':       get('--primary-text-color'),
                '--mp-text-muted': get('--secondary-text-color'),
                '--mp-border':     get('--divider-color'),
                '--mp-primary':    get('--primary-color'),
              };
              Object.entries(map).forEach(([k, v]) => { if (v) r.style.setProperty(k, v); });
            }
          } catch(e) { /* cross-origin or standalone – keep dark defaults */ }
          // Always detect light vs dark (works for standalone too)
          this.detectThemeMode();
        },

        detectThemeMode() {
          try {
            // Use a temporary probe element to resolve the actual computed bg color
            const probe = document.createElement('div');
            probe.style.cssText = 'position:absolute;visibility:hidden;background:var(--mp-bg);';
            document.body.appendChild(probe);
            const rgb = getComputedStyle(probe).backgroundColor;
            probe.remove();
            const m = rgb.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
            if (!m) return;
            // Perceived luminance (ITU-R BT.601)
            const lum = (0.299 * +m[1] + 0.587 * +m[2] + 0.114 * +m[3]) / 255;
            document.documentElement.setAttribute('data-theme', lum > 0.55 ? 'light' : 'dark');
          } catch(e) { /* fall back to dark defaults */ }
        },

        async loadPlan() {
          const today = new Date();
          const todayISO = toISO(today);
          const days = [];
          for (let i = -2; i <= 18; i++) {
            const d = new Date(today);
            d.setDate(today.getDate() + i);
            const iso = toISO(d);
            const wi = (d.getDay() + 6) % 7; // 0=Mo … 6=So
            days.push({
              iso,
              weekday: this.S.weekdays[wi],
              weekdayLong: this.S.weekdaysLong[wi],
              dayNum: d.getDate(),
              month: this.S.months[d.getMonth()],
              isToday: iso === todayISO,
              label: `${this.S.weekdaysLong[wi]}, ${d.getDate()}. ${this.S.months[d.getMonth()]}`,
            });
          }
          this.weekDays = days;

          const s = days[0], e = days[days.length - 1];
          this.weekLabel = `${s.dayNum}. ${s.month} – ${e.dayNum}. ${e.month}`;

          const fromIso = days[0].iso;
          const toIso = days[days.length - 1].iso;
          try {
            const resp = await fetch(`${API}/plan?from=${fromIso}&to=${toIso}`);
            this.plan = await resp.json();
          } catch(err) {
            console.error('Failed to load plan', err);
            this.plan = {};
          }
          // Load holidays for the same range — failures are non-fatal
          try {
            const hr = await fetch(`/api/meal_planner/holidays?from=${fromIso}&to=${toIso}`);
            this.holidays = hr.ok ? await hr.json() : {};
          } catch(err) {
            this.holidays = {};
          }
        },

        // ── Day card styles ──
        dayCardClass(day) {
          const p = this.plan[day.iso];
          let base;
          if (day.isToday) base = p?.type === 'nothing' ? 'mp-day-today mp-day-nothing' : 'mp-day-today';
          else if (!p) base = 'mp-day-default';
          else if (p.type === 'nothing') base = 'mp-day-nothing';
          else if (p.type === 'dish' || p.type === 'custom') base = 'mp-day-dish';
          else base = 'mp-day-default';
          if (this.holidays[day.iso]) base += ' mp-day-holiday';
          return base;
        },
        holidayName(day) {
          return this.holidays[day.iso] || '';
        },
        typeTagClass(type) {
          const map = {
            dish:       'tag-dish',
            custom:     'tag-dish',
            eating_out: 'tag-out',
            order:      'tag-order',
            nothing:    'tag-none',
          };
          return map[type] || 'tag-none';
        },
        typeLabel(type) {
          return this.S[`type_${type}`] || type;
        },
        formatDate(iso) {
          if (!iso) return '';
          const [y, m, d] = iso.split('-');
          return `${d}.${m}.${y}`;
        },

        // ── Modal ──
        sortedDishes() {
          return this.allDishes.slice().sort((a, b) => a.name.localeCompare(b.name, this.lang));
        },

        async openDay(day) {
          this.activeDay = day;
          this.editMode = false;
          this.customText = '';
          this.addToList = false;
          this.surpriseResult = null;
          this.suggestions = [];
          this.modalOpen = true;
          this.loadDishes();
          if (!this.plan[day.iso]) {
            await this.loadSuggestions();
          }
        },
        closeModal() {
          this.modalOpen = false;
          this.editMode = false;
          this.surpriseResult = null;
          this.specialPending = null;
          this.specialLabel = '';
          this.showMove = false;
        },
        async startEdit() {
          this.editMode = true;
          this.customText = '';
          this.surpriseResult = null;
          this.loadDishes();
          await this.loadSuggestions();
        },

        async loadSuggestions() {
          if (!this.activeDay) return;
          this.loadingSuggestions = true;
          try {
            const resp = await fetch(`${API}/suggest/${this.activeDay.iso}`);
            this.suggestions = await resp.json();
          } catch(e) {
            console.error('Failed to load suggestions', e);
            this.suggestions = [];
          } finally {
            this.loadingSuggestions = false;
          }
        },

        async acceptDish(dish) {
          await this.saveDay({ type: 'dish', dish_id: dish.id, dish_name: dish.name });
        },

        async rejectDish(dish, mode) {
          this.rejecting = true;
          try {
            const resp = await fetch(`${API}/suggest/${this.activeDay.iso}/reject`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ dish_id: dish.id, mode }),
            });
            this.suggestions = await resp.json();
          } catch(e) {
            console.error('Reject failed', e);
          } finally {
            this.rejecting = false;
          }
        },

        toggleSpecialInput(type) {
          if (this.specialPending === type) {
            // Toggle off
            this.specialPending = null;
            this.specialLabel = '';
          } else {
            this.specialPending = type;
            this.specialLabel = '';
            this.$nextTick(() => { this.$refs.specialInput?.focus(); });
          }
        },
        async confirmSpecial() {
          const payload = { type: this.specialPending };
          if (this.specialLabel.trim()) payload.dish_name = this.specialLabel.trim();
          this.specialPending = null;
          this.specialLabel = '';
          await this.saveDay(payload);
        },
        async setSpecial(type) {
          this.specialPending = null;
          this.specialLabel = '';
          await this.saveDay({ type });
        },
        async saveCustom() {
          const name = this.customText.trim();
          if (!name) return;
          await this.saveDay({ type: 'custom', dish_name: name, add_to_list: this.addToList });
        },
        async acceptSurprise() {
          if (!this.surpriseResult) return;
          await this.saveDay({ type: 'custom', dish_name: this.surpriseResult.name, add_to_list: true });
        },

        async saveDay(payload) {
          try {
            const resp = await fetch(`${API}/plan/${this.activeDay.iso}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
            if (!resp.ok) throw new Error(await resp.text());
            const entry = await resp.json();
            this.plan[this.activeDay.iso] = entry;
            this.closeModal();
            this.advanceToNextUnplanned();
          } catch(e) {
            alert(this.S.errorPrefix + e.message);
          }
        },

        advanceToNextUnplanned() {
          const currentIdx = this.weekDays.findIndex(d => d.iso === this.activeDay?.iso);
          const after  = this.weekDays.slice(currentIdx + 1).find(d => !this.plan[d.iso]);
          const before = this.weekDays.slice(0, currentIdx).find(d => !this.plan[d.iso]);
          const next = after || before;
          if (next) setTimeout(() => { if (!this.modalOpen) this.openDay(next); }, 220);
        },

        async clearDay(iso) {
          try {
            await fetch(`${API}/plan/${iso}`, { method: 'DELETE' });
            const updated = { ...this.plan };
            delete updated[iso];
            this.plan = updated;
            this.closeModal();
          } catch(e) {
            console.error('Clear failed', e);
          }
        },

        // ── Move / swap ──
        async openMove() {
          if (!this.activeDay) return;
          const base = new Date(this.activeDay.iso + 'T12:00');
          const days = [];
          for (let i = -7; i <= 7; i++) {
            const d = new Date(base);
            d.setDate(base.getDate() + i);
            const iso = toISO(d);
            const wi = (d.getDay() + 6) % 7;
            days.push({
              iso,
              weekday: this.S.weekdays[wi],
              dayNum: d.getDate(),
              isToday: iso === this.today,
            });
          }
          this.moveDays = days;
          this.movePlan = {};
          this.showMove = true;
          // Fetch the plan for the whole window (may extend beyond the loaded range)
          const from = days[0].iso, to = days[days.length - 1].iso;
          try {
            const resp = await fetch(`${API}/plan?from=${from}&to=${to}`);
            if (resp.ok) {
              const raw = await resp.json();
              const clean = {};
              for (const [k, v] of Object.entries(raw)) if (v) clean[k] = v;
              this.movePlan = clean;
            }
          } catch(e) {
            console.error('Failed to load move window', e);
          }
        },
        moveSourceLabel() {
          if (!this.activeDay) return '';
          const p = this.plan[this.activeDay.iso];
          const what = p ? (p.dish_name || this.typeLabel(p.type)) : '';
          return `${this.activeDay.label}${what ? ' · ' + what : ''}`;
        },
        moveEntryText(d) {
          const p = this.movePlan[d.iso];
          if (!p) return '';
          return p.dish_name || this.typeLabel(p.type);
        },
        async doMove(targetIso) {
          if (!this.activeDay || targetIso === this.activeDay.iso) return;
          try {
            const resp = await fetch(`${API}/plan/${this.activeDay.iso}/move`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ target: targetIso }),
            });
            if (!resp.ok) throw new Error(await resp.text());
            this.showMove = false;
            this.closeModal();
            await this.loadPlan();
          } catch(e) {
            alert(this.S.errorPrefix + e.message);
          }
        },

        // ── Surprise me ──
        async surpriseMe(source = 'themealdb') {
          this.surpriseSource = source;
          this.surpriseLoading = true;
          this.surpriseResult = null;
          try {
            if (source === 'chefkoch') {
              const resp = await fetch('/api/meal_planner/surprise/chefkoch');
              if (!resp.ok) throw new Error(this.S.errorNoRecipes);
              const meal = await resp.json();
              this.surpriseResult = {
                name: meal.name,
                thumb: meal.image || null,
                category: 'Chefkoch',
                area: '',
                url: meal.url || null,
              };
            } else {
              const resp = await fetch('https://www.themealdb.com/api/json/v1/1/random.php');
              const data = await resp.json();
              const meal = data?.meals?.[0];
              if (meal) {
                this.surpriseResult = {
                  name: meal.strMeal,
                  thumb: meal.strMealThumb,
                  category: meal.strCategory || '',
                  area: meal.strArea || '',
                  url: null,
                };
              }
            }
          } catch(e) {
            alert(this.S.errorNoRecipes + ': ' + e.message);
          } finally {
            this.surpriseLoading = false;
          }
        },

        // ── Dish manager ──
        async openStats() {
          this.showStats = true;
          this.statsData = null;
          try {
            const resp = await fetch(`${API}/stats`);
            if (resp.ok) this.statsData = await resp.json();
          } catch(e) { console.error('stats fetch failed', e); }
        },

        async openDishManager() {
          this.showDishManager = true;
          this.dishManagerTab = 'list';
          await this.loadDishes();
        },
        openBulkEdit() {
          this.bulkText = this.allDishes.map(d => d.name).join('\n');
          this.dishManagerTab = 'bulk';
        },
        async saveBulk() {
          const newNames = this.bulkText
            .split('\n')
            .map(l => l.trim())
            .filter(l => l.length > 0);

          if (newNames.length === 0 && !confirm(this.S.confirmDeleteAllDishes)) return;

          const existing = new Map(this.allDishes.map(d => [d.name.toLowerCase(), d]));
          const incoming = new Set(newNames.map(n => n.toLowerCase()));

          // Add new
          for (const name of newNames) {
            if (!existing.has(name.toLowerCase())) {
              await fetch(`${API}/dishes`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name }),
              });
            }
          }
          // Remove deleted
          for (const [key, dish] of existing) {
            if (!incoming.has(key)) {
              await fetch(`${API}/dishes/${dish.id}`, { method: 'DELETE' });
            }
          }

          await this.loadDishes();
          this.dishManagerTab = 'list';
        },
        async loadDishes() {
          try {
            const resp = await fetch(`${API}/dishes`);
            this.allDishes = await resp.json();
          } catch(e) {
            console.error('Failed to load dishes', e);
          }
        },
        async addDish() {
          const name = this.newDishName.trim();
          if (!name) return;
          try {
            const resp = await fetch(`${API}/dishes`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name }),
            });
            if (resp.status === 409) { alert(this.S.dishAlreadyExists); return; }
            if (!resp.ok) throw new Error(await resp.text());
            this.newDishName = '';
            await this.loadDishes();
          } catch(e) {
            alert(this.S.errorPrefix + e.message);
          }
        },
        async deleteDish(id) {
          if (!confirm(this.S.confirmDeleteDish)) return;
          try {
            await fetch(`${API}/dishes/${id}`, { method: 'DELETE' });
            await this.loadDishes();
          } catch(e) {
            console.error('Delete failed', e);
          }
        },
        async unblockDish(dish) {
          try {
            const resp = await fetch(`${API}/dishes/${dish.id}/unblock`, { method: 'POST' });
            if (resp.ok) await this.loadDishes();
          } catch(e) {
            console.error('Unblock failed', e);
          }
        },
      };
    }
  </script>
</body>
</html>
