<!DOCTYPE html>
<!-- Lovelace cards on a stand-in dashboard. Served by dev/mock_server.py at /dev/cards.html -->
<html><head><meta charset="utf-8"><title>Meal Planner cards</title>
<style>
  body { margin: 0; padding: 16px; background: #111; font-family: Roboto, system-ui, sans-serif;
    --primary-color: #03a9f4; --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b;
    --divider-color: rgba(225,225,225,0.12); --secondary-background-color: #282828;
    --ha-card-background: #1c1c1c; --text-primary-color: #fff; }
  body.light { background: #fafafa; --primary-text-color: #212121; --secondary-text-color: #727272;
    --divider-color: rgba(0,0,0,0.12); --secondary-background-color: #e5e5e5; --ha-card-background: #fff; }
  .bar { color: #9b9b9b; margin-bottom: 12px; font-size: 14px; }
  .col { width: 420px; display: flex; flex-direction: column; gap: 12px; }
</style>
<script>
  // Stand-in for HA's ha-card
  customElements.define('ha-card', class extends HTMLElement {
    constructor() { super(); this.attachShadow({mode:'open'}).innerHTML =
      '<style>:host{display:block;background:var(--ha-card-background);border-radius:12px;border:1px solid var(--divider-color)}</style><slot></slot>'; }
  });
</script>
<script type="module" src="/meal_planner_frontend/meal-planner-card.js"></script>
</head><body>
<div class="bar"><label><input type="checkbox" id="light"> light theme</label></div>
<div class="col" id="col"></div>
<script type="module">
  await customElements.whenDefined('meal-planner-upcoming-card');
  const add = (type, cfg) => {
    const c = document.createElement(type);
    c.setConfig(cfg);
    c.hass = { states: {} };
    document.getElementById('col').appendChild(c);
    return c;
  };
  const cards = [
    add('meal-planner-upcoming-card', { title: 'Nächste Gerichte', days: 7 }),
    add('meal-planner-upcoming-card', { title: 'relative: near, show_empty', days: 5, relative: 'near', show_empty: true }),
    add('meal-planner-list-card', { title: 'Liste' }),
  ];
  document.getElementById('light').addEventListener('change', e => {
    document.body.classList.toggle('light', e.target.checked);
    cards.forEach(c => c._render());
  });
</script>
</body></html>
